<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TerraBuild — P2P Sandbox Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;color:#eef3f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:1px solid #394651;background:#202a33;color:#eef3f7;border-radius:10px;padding:10px 14px}
button:hover{background:#2b3742}.primary{background:#5b78ff;border-color:#7189ff}.danger{background:#6b2830}.hidden{display:none!important}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#263747,#0c1116 65%)}
.card{width:min(760px,92vw);padding:34px;border:1px solid #42505c;border-radius:20px;background:#151d24eF;box-shadow:0 20px 80px #0008}
h1{font-size:44px;margin:0 0 6px}h2{margin-top:0}.sub{color:#9eabb5}.menuBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.menuBtns button{min-height:64px;font-size:18px}
.panel{margin-top:20px;padding:18px;border-radius:14px;background:#0f151b;border:1px solid #303c46}.row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}.row>*{flex:1;min-width:120px}label{font-size:13px;color:#9eabb5}input,select{width:100%;padding:10px;border-radius:9px;border:1px solid #3a4752;background:#182129;color:#fff}.small{font-size:12px;color:#8997a2}.back{margin-top:12px}
#game{position:absolute;inset:0;background:#89b9d1}.topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.topbar>*{pointer-events:auto}.pill{padding:8px 11px;background:#111820d9;border:1px solid #46535e;border-radius:10px;font-size:13px}
#world{position:absolute;inset:0;overflow:hidden;perspective:900px;background:linear-gradient(#86b7cf 0 53%,#5f8f58 53% 100%)}
#ground{position:absolute;left:-20%;top:53%;width:140%;height:70%;transform:rotateX(60deg);transform-origin:top;background:repeating-linear-gradient(90deg,#5c8b55 0 48px,#618f59 48px 96px),repeating-linear-gradient(0deg,#5d8b55 0 48px,#638f59 48px 96px);box-shadow:inset 0 20px 50px #345b32}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}.crossline{position:absolute;background:#fff;box-shadow:0 0 3px #000}.crossline.a{width:22px;height:2px;top:10px}.crossline.b{height:22px;width:2px;left:10px}
#player{position:absolute;left:50%;top:47%;width:46px;height:110px;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 5px #0005);pointer-events:none}
.part{position:absolute;border:2px solid #26313a;background:#4d78c9}.head{width:38px;height:38px;left:4px;top:0;border-radius:7px;background:#e3b78d}.torso{width:44px;height:48px;left:1px;top:40px}.arm{width:14px;height:45px;top:42px;border-radius:5px}.al{left:-13px}.ar{right:-13px}.leg{width:16px;height:43px;top:88px;border-radius:4px}.ll{left:3px}.lr{right:3px}
#toolbox{position:absolute;left:10px;bottom:10px;width:270px;background:#111820e8;border:1px solid #46535e;border-radius:14px;padding:10px}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.tool.active{outline:2px solid #7f94ff;background:#303d67}.tool span{display:block;font-size:11px;color:#9caab4}
#status{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);padding:8px 14px;border-radius:9px;background:#111820d9;border:1px solid #46535e}
#buildPreview{position:absolute;left:50%;top:52%;width:70px;height:70px;transform:translate(-50%,-50%);border:2px dashed #fff9;background:#fff3;pointer-events:none}
#avatarPanel{max-height:65vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.partCard{padding:12px;border:1px solid #303c46;border-radius:12px;background:#121a21}.partCard b{display:block;margin-bottom:7px}
#facePreview{min-height:54px;padding:8px;border:1px dashed #50606d;border-radius:8px;word-break:break-all}
@media(max-width:650px){.menuBtns{grid-template-columns:1fr}.card{padding:22px}.grid{grid-template-columns:1fr}#toolbox{width:210px}}
</style>
</head>
<body>
<section id="menu">
 <div class="card">
  <h1>TerraBuild</h1>
  <div class="sub">Smooth terrain • physics building • peer-hosted room prototype</div>
  <div class="menuBtns">
   <button class="primary" onclick="showJoin()">Join</button>
   <button onclick="showCreate()">Create</button>
   <button onclick="showAvatar()">Edit Avatar</button>
  </div>
  <div id="menuPanel"></div>
 </div>
</section>

<section id="game" class="hidden">
 <div id="world">
  <div id="ground"></div>
  <div id="player"><div class="part head"></div><div class="part torso"></div><div class="part arm al"></div><div class="part arm ar"></div><div class="part leg ll"></div><div class="part leg lr"></div></div>
  <div id="buildPreview" class="hidden"></div><div id="cross"><i class="crossline a"></i><i class="crossline b"></i></div>
 </div>
 <div class="topbar"><div class="pill" id="roomInfo">Room: —</div><div class="pill" id="netInfo">Local sandbox</div></div>
 <div id="toolbox"><div class="small" style="margin-bottom:7px">TOOLS — keys 1–0</div><div class="tools" id="tools"></div></div>
 <div id="status">WASD move • Mouse look • Wheel camera • F ragdoll • Q hands</div>
</section>

<script>
"use strict";

/* ============================================================
   TerraBuild single-file prototype
   - No executable code is accepted from network messages.
   - Network payloads should be JSON data only.
   - Suspicious / oversized / malformed packets disconnect.
   - Real Internet P2P still needs a signaling step outside this file.
   ============================================================ */

const $=id=>document.getElementById(id);
const state={
 nickname:"Player", rig:"R6", room:null, tool:null, building:false, buildStep:0,
 ragdoll:false, camDist:5, yaw:0, pitch:0, selected:null, blocks:[],
 avatar:{},
 toolNames:["Shovel","Boards","Pillars","Shapes","Sword","Anchor","Glue","Motor","Conductors","Wrench","Wire"],
 toolKey:["1","2","3","4","5","6","7","8","9","0","-"]
};

function showJoin(){
 $("menuPanel").innerHTML=`
 <h2>Join room</h2>
 <div class="row"><input id="joinCode" placeholder="IP:CODE, e.g. 192.168.1.25:1234"></div>
 <div class="small">The code is validated as an IP/hostname plus a 1–20 digit room code. This demo enters a local sandbox because a browser page cannot listen as a raw server by itself.</div>
 <button class="primary" onclick="joinRoom()">Join</button> <button onclick="clearPanel()">Cancel</button>`;
}
function showCreate(){
 $("menuPanel").innerHTML=`
 <h2>Create room</h2>
 <div class="row"><input id="roomCode" inputmode="numeric" maxlength="20" placeholder="Room code (1–20 digits)"></div>
 <div class="small">In the intended architecture, this device is the authoritative host and other players connect directly to it. The browser still needs a signaling mechanism to establish WebRTC connections.</div>
 <button class="primary" onclick="createRoom()">Create</button> <button onclick="clearPanel()">Cancel</button>`;
}
function clearPanel(){$("menuPanel").innerHTML=""}
function createRoom(){
 const c=$("roomCode").value.trim();
 if(!/^\d{1,20}$/.test(c)){alert("Use 1–20 digits.");return}
 state.room="LOCAL:"+c; enterGame("Host • "+state.room);
}
function joinRoom(){
 const v=$("joinCode").value.trim();
 const m=v.match(/^([^:]+):(\d{1,20})$/);
 if(!m){alert("Enter IP/hostname:code.");return}
 state.room=v; enterGame("Peer • "+v);
}
function showAvatar(){
 $("menuPanel").innerHTML=`
 <h2>Edit Avatar</h2>
 <div id="avatarPanel">
  <div class="row"><div><label>Nickname</label><input id="nick" maxlength="24" value="${esc(state.nickname)}"></div>
  <div><label>Body</label><select id="rig"><option>R6</option><option>R15</option></select></div></div>
  <div class="grid" id="parts"></div>
  <div class="panel"><b>Face — enter 3 values</b>
   <div class="row"><input id="face1" placeholder="Face 1"><input id="face2" placeholder="Face 2"><input id="face3" placeholder="Face 3"></div>
   <div class="row"><label><input type="radio" name="faceDir" value="vertical" checked> Vertical</label><label><input type="radio" name="faceDir" value="horizontal"> Horizontal</label></div>
   <div id="facePreview"></div>
  </div>
 </div>
 <button class="primary" onclick="saveAvatar()">Save</button> <button onclick="clearPanel()">Cancel</button>`;
 const names=state.rig==="R15"?["Head","UpperTorso","LowerTorso","LeftUpperArm","LeftLowerArm","LeftHand","RightUpperArm","RightLowerArm","RightHand","LeftUpperLeg","LeftLowerLeg","LeftFoot","RightUpperLeg","RightLowerLeg","RightFoot"]:["Head","Torso","Left Arm","Right Arm","Left Leg","Right Leg"];
 $("parts").innerHTML=names.map((n,i)=>`<div class="partCard"><b>${n}</b><label>Shape</label><select data-p="${i}"><option>Block</option><option>Ball</option><option>Cylinder</option><option>Wedge</option></select><label>Color</label><input data-c="${i}" type="color" value="#4d78c9"></div>`).join("");
 $("rig").value=state.rig;
 ["face1","face2","face3"].forEach(x=>$(x).addEventListener("input",updateFace));
 $("rig").onchange=e=>{state.rig=e.target.value;showAvatar()};
}
function updateFace(){
 const a=[$("face1").value,$("face2").value,$("face3").value];
 $("facePreview").textContent=(document.querySelector('input[name="faceDir"]:checked')?.value==="vertical"?a.join("\n"):a.join(" | "));
}
function saveAvatar(){
 state.nickname=$("nick").value.trim()||"Player";state.rig=$("rig").value;
 state.avatar={faces:[$("face1").value,$("face2").value,$("face3").value],dir:document.querySelector('input[name="faceDir"]:checked')?.value};
 clearPanel();
 alert("Avatar saved.");
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

const toolInfo=[
 ["Shovel","Dig terrain; dug material must be dropped/placed somewhere."],
 ["Boards","Pick point 1 then point 2. Preview appears; changing tool cancels."],
 ["Pillars","1.5-player height; snaps vertically upward. Preview appears."],
 ["Shapes","Choose shape and size ≤ player size; preview before placing."],
 ["Sword","Damage is enabled only against a player holding a sword."],
 ["Anchor","Toggle frozen/unfrozen. Hovered block is highlighted."],
 ["Glue","Pick block 1 and block 2; both highlight. Changing tool cancels."],
 ["Motor","Pick block 1 and 2; creates a motor between them, initially right-turning."],
 ["Conductors","Select lever/button/bulb, then place. Preview appears."],
 ["Wrench","Invert an object's property: motor direction, lever signal side, button latch, bulb logic."],
 ["Wire","Connect objects; motors receive; conductors can receive and output."]
];

function enterGame(net){
 $("menu").classList.add("hidden");$("game").classList.remove("hidden");
 $("roomInfo").textContent=state.room||"Room";$("netInfo").textContent=net;
 $("tools").innerHTML=toolInfo.map((x,i)=>`<button class="tool" title="${x[1]}" onclick="selectTool(${i})">${x[0]}<span>${state.toolKey[i]||""}</span></button>`).join("");
 selectTool(0);setupInput();
}
function selectTool(i){
 state.tool=i;state.building=false;state.buildStep=0;state.selected=null;
 document.querySelectorAll(".tool").forEach((b,n)=>b.classList.toggle("active",n===i));
 $("buildPreview").classList.toggle("hidden",![1,2,3,8].includes(i));
 $("status").textContent=toolInfo[i][1];
}
function setupInput(){
 if(window._tbSetup)return;window._tbSetup=true;
 const keys=new Set();
 addEventListener("keydown",e=>{
  if(["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName))return;
  if(e.key==="f"||e.key==="F"){state.ragdoll=!state.ragdoll;document.body.classList.toggle("ragdolled",state.ragdoll);$("status").textContent=state.ragdoll?"Ragdoll ON — press F to recover":"Ragdoll OFF";return}
  if(e.key.toLowerCase()==="q"){ $("status").textContent="Hands cleared (nothing dropped)."; return}
  const n=state.toolKey.indexOf(e.key);if(n>=0)selectTool(n);
  if(["r","t","y"].includes(e.key.toLowerCase())){$("buildPreview").style.rotate=e.key.toLowerCase()==="r"?"0deg":e.key.toLowerCase()==="t"?"90deg":"180deg"}
  keys.add(e.key.toLowerCase());
 });
 addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
 addEventListener("wheel",e=>{state.camDist=Math.max(2,Math.min(14,state.camDist+e.deltaY*.005));$("player").style.transform=`translate(-50%,-50%) scale(${Math.max(.8,1+(state.camDist-5)*.02)})`},{passive:true});
 addEventListener("mousemove",e=>{
  if(e.buttons===2||document.pointerLockElement){state.yaw+=e.movementX*.12;state.pitch=Math.max(-70,Math.min(70,state.pitch-e.movementY*.12));$("player").style.transform=`translate(-50%,-50%) rotate(${state.yaw}deg)`;}
 });
 $("world").addEventListener("contextmenu",e=>e.preventDefault());
 $("world").addEventListener("click",()=>{
   if(state.ragdoll)return;
   if([1,2,3,8].includes(state.tool)){state.buildStep++; if(state.buildStep>=2){state.buildStep=0;$("status").textContent="Preview confirmed — click again to place, or choose another tool to cancel."}}
   else if([5,6,7,9,10].includes(state.tool)){$("status").textContent=toolInfo[state.tool][0]+" target selected. Click another object to continue."}
   else if(state.tool===0){$("status").textContent="Terrain dug. The material is now a carried item — place/drop it somewhere."}
   else if(state.tool===4){$("status").textContent="Sword hit check: target must also have a sword equipped."}
 });
}
</script>
</body>
</html>
